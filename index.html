<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hummingbird Tab System</title>
    <meta
      http-equiv="refresh"
      content="0; url=./frontend/index.html"
    />
    <script>
      (function redirectToFrontend() {
        var target = "./frontend/index.html" + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #edf7f1;
        color: #16392b;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      a {
        color: #1f6a4e;
      }
    </style>
  </head>
  <body>
    <p>Opening Hummingbird... If not redirected, <a href="./frontend/index.html">continue here</a>.</p>
  </body>
</html>
