<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hummingbird Tab System | Debate Tournament Management</title>
    <meta
      name="description"
      content="Hummingbird Tab System manages debate tournaments, judging, registration, motions, results publishing, standings, and private access links."
    />
    <meta name="theme-color" content="#123f2f" />
    <link rel="icon" type="image/svg+xml" href="jade-hummingbird-mark.svg" />
    <link rel="shortcut icon" href="jade-hummingbird-mark.svg" />
    <link rel="apple-touch-icon" href="jade-hummingbird-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap"
    />
    <script src="backend-config.js"></script>
    <script>
      try {
        if (
          window.matchMedia("(prefers-reduced-motion: reduce)").matches ||
          window.sessionStorage.getItem("hummingbird-startup-splash-seen-v1") === "1"
        ) {
          document.documentElement.classList.add("skip-startup-splash");
        }
      } catch (error) {
        // Ignore session storage availability issues and keep the splash as a safe fallback.
      }
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="startup-splash" class="startup-splash" role="status" aria-live="polite">
      <div class="startup-grid"></div>
      <div class="startup-beam startup-beam-one"></div>
      <div class="startup-beam startup-beam-two"></div>
      <div class="startup-splash-inner">
        <div class="startup-logo-stage">
          <span class="startup-orbit-ring outer"></span>
          <span class="startup-orbit-ring inner"></span>
          <span class="startup-orbit-dot one"></span>
          <span class="startup-orbit-dot two"></span>
          <div class="startup-logo-card">
            <img class="startup-logo" src="jade-logo.jpg" alt="Hummingbird Tab System logo" />
          </div>
        </div>
        <div class="startup-wordmark">
          <p class="startup-kicker">Hummingbird Tab System</p>
          <strong class="startup-title">Professional Debate Tournament Management</strong>
          <p class="startup-motto">Fuelling a Thinking Revolution</p>
          <span class="startup-subtitle" id="startup-progress-label">Opening your tournament workspace...</span>
        </div>
        <div class="startup-status-stack">
          <div class="startup-chip-row" aria-hidden="true">
            <span class="startup-chip">Tabbing</span>
            <span class="startup-chip">Judging</span>
            <span class="startup-chip">Publishing</span>
          </div>
          <div class="startup-progress-shell">
            <div class="startup-progress-meta">
              <span id="startup-progress-stage">Opening dashboard</span>
              <strong id="startup-progress-value" class="startup-progress-value">12%</strong>
            </div>
            <div class="startup-progress-track">
              <span id="startup-progress-bar" class="startup-progress-bar"></span>
            </div>
          </div>
          <button id="startup-skip" class="startup-skip-button" type="button">Skip intro</button>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
